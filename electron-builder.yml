# Main launcher build config.
#
# Output: release/win-unpacked/  — an unpacked directory, NOT an installer.
# The Setup.exe is built separately by scripts/build-installer.mjs which
# copies win-unpacked/ into installer/payload/ and runs electron-builder
# against electron-builder.installer.yml. That two-stage flow gives us a
# custom-branded wizard instead of NSIS's generic Win32 UI.
#
# Mac/Linux still ship the platform-native installers because nobody has
# requested a custom wizard there yet — keep it simple.
appId: com.svu.nexuslauncher
productName: Nexus Launcher
copyright: Copyright © SVU
directories:
  buildResources: build
  output: release
files:
  - dist
  - dist-electron
  # Cosmetics breakdown (1.8 GB total) :
  #   - avatar_decorations : 557 MB → INCLUS depuis v0.4.0 (l'user attendait
  #     ses decos animées dans le build release ; sans elles l'avatar
  #     reste nu en prod alors qu'il marche en dev)
  #   - nameplates        : 17 MB → INCLUS
  #   - profile_effects   : 1.2 GB → EXCLUS (rare cosmetics qui shippent un
  #     APNG multi-couches par effet ; trop lourd pour l'installer.
  #     Future v0.5 : runtime CDN loader pour streamer à la demande.)
  - "!dist/cosmetics/profile_effects/**/*"
asarUnpack:
  - "**/*.{node,dll}"
# PowerShell helpers we shell out to from electron/services. These ride
# under resources/scripts/ in the packed app so process.resourcesPath
# is enough to find them — keeps the asar small and lets the .ps1 be
# auditable on disk.
extraResources:
  - from: electron/scripts
    to: scripts
    filter:
      - "**/*.ps1"
  # Phase 2 Nexus Input helper — single-file self-contained .NET
  # executable qui parle à ViGEmBus + read HID DualSense. Spawned
  # par controller-bridge.service.ts au toggle "Activer Nexus Input".
  # Build via `dotnet publish` dans tools/nexus-input/dist/.
  - from: tools/nexus-input/dist/NexusInput.exe
    to: nexus-input/NexusInput.exe
  # ViGEmBus driver installer (par Nefarius, MIT) — bundlé pour que
  # l'user n'ait pas à le chercher manuellement comme Steam le fait
  # avec son propre driver. controller-bridge.service vérifie la
  # registry au start et lance l'installer en UAC-elevated si absent.
  - from: installer-extras/ViGEmBus_Setup.exe
    to: drivers/ViGEmBus_Setup.exe
  # HidHide driver — kernel filter qui cache les manettes physiques
  # aux apps qui ne sont pas dans la whitelist. C'est CE qui fait
  # que Steam Input "remplace" vraiment la manette : le jeu ne
  # voit littéralement plus le pad physique, juste notre virtual.
  # Sans ça, l'open-exclusive HID n'empêche pas le jeu de scruter
  # le device via Windows.Gaming.Input → bug 2-joueurs persiste.
  - from: installer-extras/HidHide_Setup.exe
    to: drivers/HidHide_Setup.exe
  # Avatar decorations + nameplates : 574 MB de PNG. Vite skip
  # silently la copie de public/cosmetics au build (1.8 GB total,
  # timeout / file watcher issue). On bundle direct via extraResources
  # → `<resources>/cosmetics/...`. Le file:// interceptor dans main.ts
  # connaît ce path en fallback de RENDERER_DIST.
  # profile_effects (1.2 GB) reste exclu — future v0.5 le streamera
  # depuis un CDN.
  - from: public/cosmetics
    to: cosmetics
    filter:
      - "**/*.png"
      - "**/*.webm"
      - "**/*.json"
      # profile_effects (1.2 GB d'APNG multi-couches) : on les bundle
      # depuis v0.5.0 parce que sans eux le lecteur étendu n'a aucune
      # déco animée derrière la cover, ce qui retire toute la valeur
      # du picker "Animation du lecteur" côté Personnalisation. Le
      # gain installer ≈ +1.2 GB mais c'est le coût acceptable pour
      # avoir parité dev/prod sur les cosmetics.
win:
  target:
    # `dir` = bare unpacked output, no installer. The Setup.exe is then
    # built by the installer/ wrapper which copies this tree as payload.
    - target: dir
      arch: [x64]
  icon: build/icon.ico
  # Single-file artifact name doesn't matter much for `dir` target
  # (it ships as a folder), but keeping it for consistency.
  artifactName: ${productName}-${version}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
linux:
  target:
    - target: AppImage
      arch: [x64]
